{% extends 'base.html' %}
{% block title %}Register | CODEweave{% endblock %}

{% block content %}
<div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="stat-card-icon mx-auto mb-3" style="background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan);">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2 class="fw-extrabold text-white mb-1">Create Your Account</h2>
                    <p class="text-secondary small">Join CODEweave and start mastering structured roadmaps today.</p>
                </div>

                <form id="registerForm" method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label text-secondary small">First Name</label>
                            <input type="text" class="form-control form-control-glass" id="first_name" name="first_name" required placeholder="First name">
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label text-secondary small">Last Name</label>
                            <input type="text" class="form-control form-control-glass" id="last_name" name="last_name" required placeholder="Last name">
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label text-secondary small">Username</label>
                            <input type="text" class="form-control form-control-glass" id="username" name="username" required placeholder="Choose a username">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label text-secondary small">Email Address</label>
                            <input type="email" class="form-control form-control-glass" id="email" name="email" required placeholder="you@example.com">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small">Password</label>
                        <input type="password" class="form-control form-control-glass" id="password" name="password" required placeholder="Create a strong password">
                    </div>

                    <div id="registerMessage" class="alert d-none border-0 rounded-3 small"></div>
                    <button type="submit" class="btn btn-indigo w-100 py-3 rounded-3 d-inline-flex align-items-center justify-content-center gap-2">
                        <span>Complete Registration</span> <i class="fa-solid fa-user-check"></i>
                    </button>
                </form>

                <p class="text-center mt-4 mb-0 text-secondary small">
                    Already have an account?
                    <a href="/login/" class="text-cyan text-decoration-none fw-semibold">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
