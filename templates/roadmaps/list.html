{% extends 'base.html' %}
{% block title %}Roadmaps | CODEweave{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <span class="badge-glass-indigo mb-2 d-inline-block">Curated Learning Tracks</span>
            <h2 class="fw-extrabold mb-1">Explore Developer Roadmaps</h2>
            <p class="text-secondary mb-0">Follow step-by-step guides, unlock content, test your skills, and track your completion.</p>
        </div>
    </div>

    <div id="roadmapsGrid" class="row g-4"></div>
</div>

<script>
    async function loadRoadmaps() {
        const container = document.getElementById('roadmapsGrid');
        try {
            const token = localStorage.getItem('accessToken');
            const [roadmapsRes, progressRes, stepsRes] = await Promise.all([
                fetch('/api/roadmaps/roadmaps/'),
                token ? fetch('/api/roadmaps/progress/', { headers: { Authorization: `Bearer ${token}` } }) : Promise.resolve({ ok: false }),
                token ? fetch('/api/roadmaps/steps/', { headers: { Authorization: `Bearer ${token}` } }) : Promise.resolve({ ok: false })
            ]);

            const data = await roadmapsRes.json();
            if (!Array.isArray(data) || !data.length) {
                container.innerHTML = '<div class="col-12"><div class="alert alert-dark border-0 glass-card text-secondary"><i class="fa-solid fa-info-circle me-2"></i>No roadmaps are available right now.</div></div>';
                return;
            }

            const progressItems = progressRes.ok ? await progressRes.json() : [];
            const allSteps = stepsRes.ok ? await stepsRes.json() : [];
            let isInstructor = false;

            if (token) {
                try {
                    const profileResponse = await fetch('/api/accounts/profile/', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const profileData = await profileResponse.json().catch(() => ({}));
                    const role = (profileData.role || profileData.effective_role || '').toLowerCase();
                    isInstructor = ['instructor', 'admin'].includes(role);
                } catch (error) {
                    console.error(error);
                }
            }

            const completedStepIds = new Set(
                (Array.isArray(progressItems) ? progressItems : [])
                    .filter(p => p.status === 'completed')
                    .map(p => p.step)
            );

            const stepsByRoadmap = new Map();
            (Array.isArray(allSteps) ? allSteps : []).forEach(step => {
                const rId = step.roadmap || step.roadmap_id;
                if (!stepsByRoadmap.has(rId)) stepsByRoadmap.set(rId, []);
                stepsByRoadmap.get(rId).push(step);
            });

            container.innerHTML = data.map(roadmap => {
                const steps = (Array.isArray(roadmap.steps) && roadmap.steps.length)
                    ? roadmap.steps
                    : (stepsByRoadmap.get(roadmap.id) || []);
                const totalSteps = steps.length;
                const completedSteps = steps.filter(s => completedStepIds.has(s.id)).length;
                const isCompleted = totalSteps > 0 && completedSteps === totalSteps;
                const inProgress = completedSteps > 0 && !isCompleted;
                const progressPct = totalSteps > 0 ? Math.round((completedSteps / totalSteps) * 100) : 0;

                const completionBadge = isCompleted
                    ? `<span class="badge-glass-emerald"><i class="fa-solid fa-trophy me-1"></i> Completed</span>`
                    : inProgress
                    ? `<span class="badge-glass-cyan"><i class="fa-solid fa-spinner me-1"></i> ${completedSteps}/${totalSteps} Steps (${progressPct}%)</span>`
                    : `<span class="badge-glass-muted">${totalSteps} Step${totalSteps === 1 ? '' : 's'}</span>`;

                const cardBorder = isCompleted
                    ? 'border-emerald border-opacity-50'
                    : inProgress
                    ? 'border-cyan border-opacity-30'
                    : '';

                return `
                    <div class="col-md-6 col-xl-4">
                        <div class="glass-card p-4 h-100 d-flex flex-column glass-card-interactive ${cardBorder}">
                            <div class="d-flex justify-content-between align-items-start mb-3 gap-2">
                                <div class="stat-card-icon" style="background: ${isCompleted ? 'rgba(16, 185, 129, 0.15)' : 'rgba(99, 102, 241, 0.15)'}; color: ${isCompleted ? 'var(--accent-emerald)' : 'var(--accent-indigo)'};">
                                    <i class="fa-solid ${isCompleted ? 'fa-circle-check' : 'fa-route'}"></i>
                                </div>
                                ${completionBadge}
                            </div>
                            <h4 class="fw-bold text-white mb-2">${roadmap.title}</h4>
                            <p class="text-secondary mb-3 flex-grow-1 line-clamp-3 small">${roadmap.description || 'No description provided.'}</p>
                            
                            ${totalSteps > 0 ? `
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center small text-secondary mb-1">
                                        <span>Progress</span>
                                        <span class="fw-bold ${isCompleted ? 'text-emerald' : 'text-indigo'}">${progressPct}%</span>
                                    </div>
                                    <div class="progress bg-dark bg-opacity-60" style="height: 6px;">
                                        <div class="progress-bar ${isCompleted ? 'bg-success' : 'bg-indigo'}" role="progressbar" style="width: ${progressPct}%;" aria-valuenow="${progressPct}" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                </div>
                            ` : ''}

                            <div class="pt-3 border-top border-secondary border-opacity-25 d-flex align-items-center justify-content-between gap-2">
                                <a href="/roadmaps/${roadmap.id}/" class="btn ${isCompleted ? 'btn-emerald' : 'btn-indigo'} btn-sm px-3 rounded-3">
                                    ${isCompleted ? '<i class="fa-solid fa-circle-check me-1"></i> Review Track' : 'View Roadmap <i class="fa-solid fa-arrow-right me-1"></i>'}
                                </a>
                                ${isInstructor ? '<a href="/instructor/" class="btn btn-outline-indigo btn-sm px-3 rounded-3"><i class="fa-solid fa-pen-to-square me-1"></i>Manage</a>' : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (error) {
            container.innerHTML = '<div class="col-12"><div class="alert alert-danger bg-danger bg-opacity-20 text-danger border-0">Unable to load roadmaps right now.</div></div>';
            console.error(error);
        }
    }

    loadRoadmaps();
</script>
{% endblock %}
